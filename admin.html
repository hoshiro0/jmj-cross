<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Starletters — Owner</title>

  <link
  rel="icon"
  type="image/png"
  href="assets/favicon.png"
>

  <style>
    * {
      box-sizing: border-box;
    }

    .admin-logo {
  display: block;
  width: 230px;
  height: auto;
  margin-bottom: 12px;
}

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080b18;
      color: #f4f5ff;
      padding: 24px;
    }

    .container {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      opacity: 0.7;
      margin-bottom: 28px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      color: white;
      outline: none;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      margin-top: 8px;
      font-size: 16px;
    }

    .login-btn {
      width: 100%;
      background: #ffffff;
      color: #111111;
    }

    .login-btn:active {
      transform: scale(0.99);
    }

    .logout-btn {
      float: right;
    }

    .letter {
      background: rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 18px;
      margin-top: 14px;
    }

    .letter-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .recipient {
      font-size: 18px;
      font-weight: bold;
    }

    .date {
      opacity: 0.55;
      font-size: 13px;
    }

    .message {
      white-space: pre-wrap;
      line-height: 1.6;
      margin-top: 15px;
    }

    .from {
      opacity: 0.7;
      margin-top: 12px;
      font-size: 14px;
    }

    .delete-btn {
      background: #9d3030;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    #loginStatus {
      margin-top: 12px;
      color: #ffaaaa;
    }

    #status {
      margin-top: 12px;
      opacity: 0.75;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>
  <img
    src="assets/starletters-logo.png"
    alt="Starletters"
    class="admin-logo"
  >
  <span>Owner</span>
</h1>

    <p class="subtitle">
      Private owner dashboard
    </p>


    <!-- LOGIN -->

    <section
      id="loginPanel"
      class="panel"
    >

      <h2>Owner Login</h2>

      <input
        id="email"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        id="loginBtn"
        type="button"
        class="login-btn"
      >
        Log in
      </button>

      <div id="loginStatus"></div>

    </section>


    <!-- ADMIN -->

    <section
      id="adminPanel"
      class="hidden"
    >

      <div class="panel">

        <button
          id="logoutBtn"
          type="button"
          class="logout-btn"
        >
          Log out
        </button>

        <h2>Letters</h2>

        <div id="status">
          Loading...
        </div>

      </div>

      <div id="letters"></div>

    </section>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>


  <script>

    document.addEventListener(
      "DOMContentLoaded",
      async function () {

        const loginPanel =
          document.getElementById(
            "loginPanel"
          );

        const adminPanel =
          document.getElementById(
            "adminPanel"
          );

        const loginBtn =
          document.getElementById(
            "loginBtn"
          );

        const logoutBtn =
          document.getElementById(
            "logoutBtn"
          );

        const email =
          document.getElementById(
            "email"
          );

        const password =
          document.getElementById(
            "password"
          );

        const loginStatus =
          document.getElementById(
            "loginStatus"
          );

        const letters =
          document.getElementById(
            "letters"
          );

        const status =
          document.getElementById(
            "status"
          );


        /* CHECK SUPABASE */

        if (
          !window.supabase ||
          !window.STARLETTERS_CONFIG
        ) {

          loginStatus.textContent =
            "Supabase could not load. Please refresh the page.";

          return;

        }


        const config =
          window.STARLETTERS_CONFIG;


        if (
          !config.SUPABASE_URL ||
          !config.SUPABASE_PUBLISHABLE_KEY
        ) {

          loginStatus.textContent =
            "Supabase configuration is missing.";

          return;

        }


        const supabase =
          window.supabase.createClient(
            config.SUPABASE_URL,
            config.SUPABASE_PUBLISHABLE_KEY
          );


        /* CHECK LOGIN */

        async function checkOwner() {

          const {
            data,
            error
          } =
            await supabase.auth.getUser();


          if (
            error ||
            !data ||
            !data.user
          ) {

            loginPanel.classList.remove(
              "hidden"
            );

            adminPanel.classList.add(
              "hidden"
            );

            return;

          }


          loginPanel.classList.add(
            "hidden"
          );

          adminPanel.classList.remove(
            "hidden"
          );

          await loadLetters();

        }


        /* LOGIN */

        loginBtn.addEventListener(
          "click",
          async function () {

            loginStatus.textContent =
              "Logging in...";

            loginBtn.disabled =
              true;


            const {
              data,
              error
            } =
              await supabase.auth
                .signInWithPassword({

                  email:
                    email.value.trim(),

                  password:
                    password.value

                });


            loginBtn.disabled =
              false;


            if (error) {

              loginStatus.textContent =
                error.message;

              return;

            }


            loginStatus.textContent =
              "";

            await checkOwner();

          }
        );


        /* LOGOUT */

        logoutBtn.addEventListener(
          "click",
          async function () {

            await supabase.auth.signOut();

            checkOwner();

          }
        );


        /* LOAD LETTERS */

        async function loadLetters() {

          status.textContent =
            "Loading letters...";


          const {
            data,
            error
          } =
            await supabase
              .from("letters")
              .select("*")
              .order(
                "created_at",
                {
                  ascending: false
                }
              );


          if (error) {

            status.textContent =
              "Unable to load letters: " +
              error.message;

            return;

          }


          letters.innerHTML = "";


          if (
            !data ||
            data.length === 0
          ) {

            status.textContent =
              "No letters yet.";

            return;

          }


          status.textContent =
            `${data.length} letter(s)`;


          data.forEach(
            function (letter) {

              const card =
                document.createElement(
                  "article"
                );

              card.className =
                "letter";


              const date =
                letter.created_at
                  ? new Date(
                      letter.created_at
                    ).toLocaleString()
                  : "";


              const recipient =
                escapeHtml(
                  letter.to_name
                );

              const message =
                escapeHtml(
                  letter.message
                );

              const from =
                escapeHtml(
                  letter.from_name
                );


              card.innerHTML = `

                <div class="letter-header">

                  <div>

                    <div class="recipient">
                      To: ${recipient}
                    </div>

                    <div class="date">
                      ${escapeHtml(date)}
                    </div>

                  </div>

                  <button
                    type="button"
                    class="delete-btn"
                  >
                    Delete
                  </button>

                </div>

                <div class="message">
                  ${message}
                </div>

                ${
                  letter.from_name
                    ? `
                      <div class="from">
                        From: ${from}
                      </div>
                    `
                    : ""
                }

              `;


              const deleteBtn =
                card.querySelector(
                  ".delete-btn"
                );


              deleteBtn.addEventListener(
                "click",
                function () {

                  deleteLetter(
                    letter.id
                  );

                }
              );


              letters.appendChild(
                card
              );

            }
          );

        }


        /* DELETE */

        async function deleteLetter(
          id
        ) {

          const confirmed =
            window.confirm(
              "Delete this letter permanently?"
            );


          if (!confirmed) {
            return;
          }


          const {
            error
          } =
            await supabase
              .from("letters")
              .delete()
              .eq(
                "id",
                id
              );


          if (error) {

            window.alert(
              "Delete failed: " +
              error.message
            );

            return;

          }


          await loadLetters();

        }


        /* ESCAPE HTML */

        function escapeHtml(
          value
        ) {

          return String(
            value ?? ""
          )
            .replace(
              /&/g,
              "&amp;"
            )
            .replace(
              /</g,
              "&lt;"
            )
            .replace(
              />/g,
              "&gt;"
            )
            .replace(
              /"/g,
              "&quot;"
            )
            .replace(
              /'/g,
              "&#039;"
            );

        }


        /* AUTH CHANGES */

        supabase.auth.onAuthStateChange(
          function () {
            checkOwner();
          }
        );


        /* START */

        await checkOwner();

      }
    );

  </script>

</body>
</html>
